AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CloudFormation template for a VPC'

Resources:

# Main VPC (the environment)
    MyVPC: 
        Type: 'AWS::EC2::VPC'
        Properties: 
            CidrBlock: '172.16.0.0/16'
            EnableDnsSupport: true
            EnableDnsHostnames: true
            Tags: 
                - Key: Name
                  Value: MyVPC
                - Key: Owner
                  Value: Myself

# AZ 1 Public Subnet, and privatre subnets for app and db (1A)
    PublicSubnet1A:
        Type: 'AWS::EC2::Subnet'
        Properties:
            VpcId: !Ref MyVPC
            CidrBlock: '172.16.1.0/24'
            AvailabilityZone: !Select [0, !GetAZs '']
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: PublicSubnet1A

    AppPrivateSubnet1A:
        Type: 'AWS::EC2::Subnet'
        Properties:
            VpcId: !Ref MyVPC
            CidrBlock: '172.16.2.0/24'
            AvailabilityZone: !Select [0, !GetAZs '']
            Tags:
                - Key: Name
                  Value: AppPrivateSubnet1A

    DataPrivateSubnet1A:
        Type: 'AWS::EC2::Subnet'
        Properties:
            VpcId: !Ref MyVPC
            CidrBlock: '172.16.3.0/24'
            AvailabilityZone: !Select [0, !GetAZs '']
            Tags:
                - Key: Name
                  Value: DataPrivateSubnet1A

# AZ2 Public Subnet, private for app and db.
    PublicSubnet2B:
        Type: 'AWS::EC2::Subnet'
        Properties:
            VpcId: !Ref MyVPC
            CidrBlock: '172.16.11.0/24'
            AvailabilityZone: !Select [1, !GetAZs '']
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: PublicSubnet2B

    AppPrivateSubnet2B:
        Type: 'AWS::EC2::Subnet'
        Properties:
            VpcId: !Ref MyVPC
            CidrBlock: '172.16.12.0/24'
            AvailabilityZone: !Select [1, !GetAZs '']
            Tags:
                - Key: Name
                  Value: AppPrivateSubnet2B

    DataPrivateSubnet2B:
        Type: 'AWS::EC2::Subnet'
        Properties:
            VpcId: !Ref MyVPC
            CidrBlock: '172.16.13.0/24'
            AvailabilityZone: !Select [1, !GetAZs '']
            Tags:
                - Key: Name
                  Value: DataPrivateSubnet2B

    # Routing

    # IGW
    InternetGateway:
        Type: 'AWS::EC2::InternetGateway'

        Properties:
            Tags:
                - Key: Name
                  Value: MyVPCInternetGateway

    # Attach IGW to VPC
    AttachGateway:
        Type: 'AWS::EC2::VPCGatewayAttachment'
        Properties:
            VpcId: !Ref MyVPC
            InternetGatewayId: !Ref InternetGateway

    # Public Route Table
    PublicRouteTable:
        Type: 'AWS::EC2::RouteTable'
        Properties:
            VpcId: !Ref MyVPC
            Tags:   
                - Key: Name
                  Value: PublicRouteTable
    # Public Routes
    PublicRoute: 
        Type: 'AWS::EC2::Route'
        DependsOn: AttachGateway
        Properties:
            RouteTableId: !Ref PublicRouteTable
            DestinationCidrBlock: '0.0.0.0/0'
            GatewayId: !Ref InternetGateway

    # Subnet Associations
    PublicSubnet1ARouteTableAssociation:
        Type: 'AWS::EC2::SubnetRouteTableAssociation'
        Properties:
            SubnetId: !Ref PublicSubnet1A
            RouteTableId: !Ref PublicRouteTable

    PublicSubnet2BRouteTableAssociation:
        Type: 'AWS::EC2::SubnetRouteTableAssociation'
        Properties:
            SubnetId: !Ref PublicSubnet2B
            RouteTableId: !Ref PublicRouteTable