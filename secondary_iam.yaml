AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM CloudFormation Template - group, role, policy'

Resources:

  # Group
  TestDevelopersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: TestDevelopersGroup
      Path: /

  # EC2 Service Role
  TestDevelopersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TestDevelopersRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

  # Test Policy
  TestDeveloperPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: TestDeveloperPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeImages
              - ec2:DescribeTags
            Resource: '*'

          - Effect: Allow
            Action:
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:RebootInstances
            Resource: 'arn:aws:ec2:*:*:instance/*'
            Condition:
              StringEquals:
                aws:ResourceTag/Environment: Dev

      Groups:
        - !Ref TestDevelopersGroup
      Roles:
        - !Ref TestDevelopersRole

Outputs:
  DeveloperGroup:
    Value: !Ref TestDevelopersGroup

  DeveloperRole:
    Value: !Ref TestDevelopersRole